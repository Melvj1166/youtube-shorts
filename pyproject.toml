[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podshorts"
version = "0.1.0"
description = "AI Podcast-to-Shorts Automation Pipeline"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.10",
    "faster-whisper>=1.0",
    "ollama>=0.3",
    "mediapipe>=0.10",
    "filterpy>=1.4",
    "pysbd>=0.3",
    "scipy>=1.13",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "ffmpeg-python>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
diarization = ["pyannote.audio>=3.3"]
dev = ["pytest>=8.0", "pytest-asyncio", "ruff"]

[project.scripts]
podshorts = "podshorts.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["podshorts"]

[tool.ruff]
line-length = 100
target-version = "py311"
